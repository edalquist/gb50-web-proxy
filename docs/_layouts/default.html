<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title | default: "HVAC Controller User Guide" }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: {
              850: '#111c33',
              900: '#0f172a',
              950: '#020617',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Custom markdown content styling matching the web dashboard */
    .markdown-content h1 {
      font-size: 1.875rem;
      font-weight: 800;
      color: #f8fafc;
      letter-spacing: -0.025em;
      margin-top: 1.5rem;
      margin-bottom: 0.5rem;
    }
    .markdown-content h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: -0.015em;
      margin-top: 2.25rem;
      margin-bottom: 0.75rem;
      padding-bottom: 0.35rem;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .markdown-content h3 {
      font-size: 1rem;
      font-weight: 700;
      color: #e2e8f0;
      margin-top: 1.5rem;
      margin-bottom: 0.5rem;
    }
    .markdown-content p {
      font-size: 0.875rem;
      line-height: 1.65;
      color: #cbd5e1;
      margin-bottom: 1rem;
    }
    .markdown-content ul, .markdown-content ol {
      font-size: 0.875rem;
      line-height: 1.6;
      color: #cbd5e1;
      margin-bottom: 1rem;
      padding-left: 1.5rem;
    }
    .markdown-content ul {
      list-style-type: disc;
    }
    .markdown-content ol {
      list-style-type: decimal;
    }
    .markdown-content li {
      margin-bottom: 0.35rem;
    }
    .markdown-content strong {
      color: #f1f5f9;
      font-weight: 600;
    }
    .markdown-content a {
      color: #60a5fa;
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: color 0.15s ease;
    }
    .markdown-content a:hover {
      color: #93c5fd;
    }
    .markdown-content img {
      width: 100%;
      height: auto;
      border-radius: 1rem;
      border: 1px solid #334155;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      margin-top: 1rem;
      margin-bottom: 1.5rem;
      background-color: #0f172a;
    }
    .markdown-content hr {
      border: 0;
      border-top: 1px solid #1e293b;
      margin: 2rem 0;
    }
    .markdown-content blockquote {
      background-color: rgba(15, 23, 42, 0.7);
      border-left: 4px solid #3b82f6;
      border-radius: 0 0.75rem 0.75rem 0;
      padding: 0.75rem 1.25rem;
      margin: 1.25rem 0;
      font-size: 0.8125rem;
      color: #94a3b8;
    }
    .markdown-content blockquote p {
      margin-bottom: 0;
      color: #cbd5e1;
    }
    .markdown-content code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.8125rem;
      background-color: #0f172a;
      color: #38bdf8;
      padding: 0.15rem 0.4rem;
      border-radius: 0.375rem;
      border: 1px solid #1e293b;
    }
    .markdown-content pre {
      background-color: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 0.875rem;
      padding: 1rem;
      overflow-x: auto;
      margin-bottom: 1.25rem;
    }
    .markdown-content pre code {
      background-color: transparent;
      border: none;
      padding: 0;
      color: #e2e8f0;
      font-size: 0.8125rem;
    }
    .markdown-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.25rem 0;
      font-size: 0.8125rem;
      border: 1px solid #1e293b;
      border-radius: 0.75rem;
      overflow: hidden;
    }
    .markdown-content th {
      background-color: #0f172a;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #1e293b;
      text-align: left;
    }
    .markdown-content td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid rgba(30, 41, 59, 0.6);
      color: #cbd5e1;
    }
    .markdown-content tr:last-child td {
      border-bottom: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-200 antialiased min-h-screen selection:bg-blue-500 selection:text-white">
  
  <!-- Top Navigation Header -->
  <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-blue-400 font-bold text-lg">
          ⌂
        </div>
        <div>
          <span class="font-extrabold text-sm sm:text-base text-white tracking-tight block leading-tight">
            HVAC Central Controller
          </span>
          <span class="text-[11px] text-slate-400 block">
            Operator &amp; Staff User Documentation
          </span>
        </div>
      </div>

      <div class="flex items-center gap-2.5">
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          User Guide
        </span>
        <a 
          href="https://github.com/edalquist/gb50-web-proxy" 
          target="_blank" 
          rel="noopener noreferrer"
          class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition"
        >
          GitHub
        </a>
      </div>
    </div>
  </header>

  <!-- Main Documentation Container -->
  <main class="max-w-5xl mx-auto px-4 sm:px-6 py-8">
    <article class="markdown-content bg-slate-900/60 border border-slate-800/80 rounded-2xl p-6 sm:p-10 shadow-2xl backdrop-blur-sm">
      {{ content }}
    </article>
  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-900 py-8 text-center text-xs text-slate-500">
    <div class="max-w-5xl mx-auto px-4 space-y-1">
      <p>Mitsubishi GB-50 / G-50 Central Controller Modern Web Proxy &amp; UI</p>
      <p class="text-slate-600">Generated for facility managers, operations coordinators, and building staff.</p>
    </div>
  </footer>

</body>
</html>
