[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["server*"]

[project]
name = "gb50-web-proxy"
version = "1.0.0"
description = "FastAPI REST & WebSocket Proxy Server and React Web UI for Mitsubishi GB-50 Central HVAC Controllers"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Eric Dalquist" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "websockets>=12.0",
    "gb50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "anyio>=4.0.0",
]

[project.scripts]
gb50-server = "server.main:main"

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
