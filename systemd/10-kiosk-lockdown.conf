# /etc/X11/xorg.conf.d/10-kiosk-lockdown.conf
# ==============================================================================
# Security Lockdown for Mitsubishi GB-50 Appliance Kiosk
# Disables Linux virtual terminal switching (Ctrl+Alt+F1-F7) and server kill
# ==============================================================================

Section "ServerFlags"
    Option "DontVTSwitch" "true"
    Option "DontZap" "true"
EndSection
